<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reported Issues | Campus CleanSpot</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="identity-bar">
  <div class="max-width inner">
    <img src="bup-logo.png" alt="BUP Crest" class="crest">
    <div>
      <p class="uni-name">BANGLADESH UNIVERSITY OF PROFESSIONALS</p>
      <p class="uni-sub">Campus Facilities &amp; Maintenance Portal</p>
    </div>
  </div>
</div>

<nav class="main-nav">
  <div class="max-width inner">
    <a class="brand-link" href="index.html">Campus CleanSpot</a>
    <div class="nav-links d-none d-md-flex">
      <a href="index.html">Home</a>
      <a href="report.html">Report</a>
      <a class="active" href="issues.html">Issues</a>
      <a href="locations.html">Locations</a>
      <a href="about.html">About</a>
    </div>
  </div>
</nav>

<div class="max-width px-4 py-5">
  <div class="d-flex flex-wrap align-items-end justify-content-between mb-4 gap-3">
    <div>
      <p class="eyebrow">Live Board</p>
      <h1 style="font-size:28px;font-weight:700;color:var(--ink);letter-spacing:-0.02em;margin:0;">Reported Issues</h1>
      <p id="countLabel" style="font-size:14px;color:var(--muted);margin-top:4px;">Showing 8 reports</p>
    </div>
    <div class="d-flex align-items-center gap-2">
      <button class="filter-btn active" data-filter="All">All</button>
      <button class="filter-btn" data-filter="Open">Open</button>
      <button class="filter-btn" data-filter="Fixed">Fixed</button>
      <div style="width:1px;height:24px;background:var(--border);margin:0 4px;"></div>
      <a href="report.html" class="btn-uni">+ New Report</a>
    </div>
  </div>

  <div class="row g-3" id="issuesGrid"></div>
</div>

<footer class="site-footer">
  <img src="bup-logo.png" alt="BUP Crest" class="crest">
  <p>Campus CleanSpot &middot; Bangladesh University of Professionals &copy; 2026</p>
</footer>

<script>
const SEED_ISSUES = [
  { title: "Overflowing waste bins near cafeteria entrance", location: "Cafeteria", status: "Open", reportedAgo: "2 hours ago" },
  { title: "Broken ceiling light in Lecture Hall B-204", location: "Academic Block B", status: "Open", reportedAgo: "5 hours ago" },
  { title: "Water leakage from pipe — Library stairwell", location: "Library Complex", status: "Fixed", reportedAgo: "1 day ago" },
  { title: "Litter accumulation near Gate 1 checkpoint", location: "Gate 1 Entrance", status: "Open", reportedAgo: "1 day ago" },
  { title: "Blocked drainage causing puddle — Parade Ground", location: "Parade Ground", status: "Fixed", reportedAgo: "2 days ago" },
  { title: "Damaged seating in Administrative lobby", location: "Administrative Building", status: "Open", reportedAgo: "3 days ago" },
  { title: "Electrical fault — Block A corridor lights flickering", location: "Academic Block A", status: "Fixed", reportedAgo: "4 days ago" },
  { title: "Pest infestation reported in dormitory storage", location: "Dormitory Block", status: "Open", reportedAgo: "5 days ago" }
];

const stored = JSON.parse(localStorage.getItem('cleanspotReports') || '[]').map(r => ({
  title: (r.type || 'Other') + (r.description ? ' — ' + r.description : ''),
  location: r.location,
  status: r.status || 'Open',
  reportedAgo: 'just now'
}));

const ALL_ISSUES = [...stored, ...SEED_ISSUES];
let currentFilter = 'All';

function render() {
  const filtered = currentFilter === 'All' ? ALL_ISSUES : ALL_ISSUES.filter(i => i.status === currentFilter);
  document.getElementById('countLabel').textContent =
    `Showing ${filtered.length} report${filtered.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('issuesGrid');
  grid.innerHTML = filtered.map(issue => `
    <div class="col-md-6">
      <div class="card-uni p-4 h-100">
        <div class="mb-3">
          <span class="badge-uni ${issue.status === 'Fixed' ? 'badge-fixed' : 'badge-open'}">
            ${issue.status === 'Fixed' ? '<i class="bi bi-check-lg"></i>' : ''}${issue.status}
          </span>
        </div>
        <h3 style="font-size:15px;font-weight:600;color:var(--ink);line-height:1.4;margin-bottom:10px;">${issue.title}</h3>
        <div class="d-flex align-items-center justify-content-between">
          <span style="color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px;">
            <i class="bi bi-geo-alt"></i> ${issue.location}
          </span>
          <span style="color:var(--muted2);font-size:12px;">Reported ${issue.reportedAgo}</span>
        </div>
      </div>
    </div>`).join('');
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    render();
  });
});

render();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
